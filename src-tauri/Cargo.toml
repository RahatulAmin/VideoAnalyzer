[package]
name = "behaviorlab-video-coder"
version = "1.0.0"
description = "Local-first behavioral video coding workspace"
authors = ["BehaviorLab"]
edition = "2021"

[lib]
name = "behaviorlab_video_coder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
